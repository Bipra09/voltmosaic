<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>VoltMosaic</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="style.css"><body><header><h1>VoltMosaic</h1><p>Simulated mobile top-ups and household bills.</p></header><main><section><h2>New transaction</h2><form id="payment"><label>Service<select name="service"><option value="mobile">Mobile top-up</option><option value="electricity">Electricity</option><option value="internet">Internet</option></select></label><label>Demo account reference<input name="reference" required maxlength="32" pattern="[A-Za-z0-9-]{4,32}"></label><label>Amount (¥)<input type="number" name="amount" required min="100" max="50000" step="1"></label><button class="btn btn-primary">Simulate payment</button></form><output id="status" aria-live="polite"></output></section><section><h2>Transaction history</h2><ul id="history"></ul></section></main><script type="module" src="app.js"></script></body></html>
